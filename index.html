    const InteractiveHeadMap = ({ selectedZones = [], onToggleZone, readOnly = false, darkMode = true }) => {

          : 'fill-slate-200/90 hover:fill-indigo-300/60 stroke-slate-400';

      const handleZoneClick = (id) => {
        if (!readOnly && onToggleZone) onToggleZone(id);

              <ellipse onClick={() => handleZoneClick('ocular_right')} cx="154" cy="126" rx="24" ry="16" className={`${getZoneFill('ocular_right')} transition-all duration-200 ${!readOnly ? 'cursor-pointer' : ''}`} strokeWidth="2" />

    function NeuroTrackApp() {
      const [darkMode, setDarkMode] = useState(true);
      const [lowLightComfort, setLowLightComfort] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard' | 'new' | 'analytics' | 'calendar' | 'history' | 'report' | 'cloud_mobile'
      const [logs, setLogs] = useState(() => {
        try {
          const saved = localStorage.getItem('neurotrack_logs_v1');
          return saved ? JSON.parse(saved) : INITIAL_LOGS;
        } catch (e) {
          return INITIAL_LOGS;
        }
      });
      const [editingId, setEditingId] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [selectedLogModal, setSelectedLogModal] = useState(null);

      const [user, setUser] = useState(null);
      const [syncStatus, setSyncStatus] = useState('local');
      const [dbRef, setDbRef] = useState(null);
      const [appIdStr, setAppIdStr] = useState('default-migraine-tracker');

      const [patientName, setPatientName] = useState('');
      const [neurologistName, setNeurologistName] = useState('Dr. ');
      const [preventiveTreatment, setPreventiveTreatment] = useState('Aucun traitement de fond actuel');

      const [filterTrigger, setFilterTrigger] = useState('all');
      const [filterMinIntensity, setFilterMinIntensity] = useState(1);

      const [calendarMonth, setCalendarMonth] = useState(9); // Octobre
      const [calendarYear, setCalendarYear] = useState(2026);

      const [formData, setFormData] = useState({
        date: '2026-10-15',
        startTime: '09:00',
        durationHours: 4,
        intensity: 6,
        zones: ['temple_left'],
        triggers: [],
        symptoms: ['photophobia'],
        medication: 'Triptan (Zomig, Relpax, Sumatriptan)',
        reliefScore: 4,
        notes: ''
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Save to phone localStorage automatically
      useEffect(() => {
        try {
          localStorage.setItem('neurotrack_logs_v1', JSON.stringify(logs));
        } catch (e) {}
      }, [logs]);

      useEffect(() => {
        const setupFirebase = async () => {
          if (!window.FirebaseSDK) return;
          try {
            const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-migraine-tracker';
            setAppIdStr(currentAppId);
            const rawConfig = typeof __firebase_config !== 'undefined' && __firebase_config ? JSON.parse(__firebase_config) : null;
            if (!rawConfig) {
              setSyncStatus('local');
              return;
            }
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore } = window.FirebaseSDK;
            const app = initializeApp(rawConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            setDbRef(db);

            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
            onAuthStateChanged(auth, (u) => {
              if (u) setUser(u);
            });
          } catch (e) {
            setSyncStatus('local');
          }
        };

        if (window.FirebaseSDK) {
          setupFirebase();
        } else {
          window.addEventListener('firebase-ready', setupFirebase);
          return () => window.removeEventListener('firebase-ready', setupFirebase);
        }
      }, []);

      useEffect(() => {
        if (!user || !dbRef || !window.FirebaseSDK) return;
        const { collection, doc, setDoc, onSnapshot } = window.FirebaseSDK;
        const colRef = collection(dbRef, 'artifacts', appIdStr, 'users', user.uid, 'migraine_logs');

        const unsub = onSnapshot(
          colRef,
          async (snap) => {
            if (snap.empty) {
              for (const item of INITIAL_LOGS) {
                await setDoc(doc(dbRef, 'artifacts', appIdStr, 'users', user.uid, 'migraine_logs', item.id), item);
              }
              setSyncStatus('synced');
            } else {
              const items = snap.docs.map((d) => d.data());
              items.sort((a, b) => new Date(b.date) - new Date(a.date));
              setLogs(items);
              setSyncStatus('synced');
            }
          },
          () => setSyncStatus('local')
        );
        return () => unsub();
      }, [user, dbRef, appIdStr]);

      const stats = useMemo(() => {
        if (!logs.length) {
          return { totalCrises: 0, avgIntensity: 0, avgDuration: 0, topTriggers: [], topZones: [], medicationStats: [], daysSinceLast: '-' };
        }
        const totalCrises = logs.length;
        const sumIntensity = logs.reduce((acc, l) => acc + Number(l.intensity), 0);
        const sumDuration = logs.reduce((acc, l) => acc + Number(l.durationHours), 0);

        const triggerMap = {};
        logs.forEach((log) => {
          (log.triggers || []).forEach((tId) => {
            if (!triggerMap[tId]) triggerMap[tId] = { count: 0, totalIntensity: 0 };
            triggerMap[tId].count += 1;
            triggerMap[tId].totalIntensity += Number(log.intensity);
          });
        });

        const topTriggers = Object.entries(triggerMap)
          .map(([id, d]) => {
            const info = TRIGGERS_CATALOG.find((t) => t.id === id) || { label: id, icon: '📌', category: 'Autre' };
            return {
              id,
              label: info.label,
              icon: info.icon,
              category: info.category,
              count: d.count,
              percentage: Math.round((d.count / totalCrises) * 100),
              avgSeverity: (d.totalIntensity / d.count).toFixed(1)
            };
          })
          .sort((a, b) => b.count - a.count);

        const zoneMap = {};
        logs.forEach((l) => (l.zones || []).forEach((z) => { zoneMap[z] = (zoneMap[z] || 0) + 1; }));
        const topZones = Object.entries(zoneMap)
          .map(([id, count]) => ({
            id,
            label: HEAD_ZONES.find((z) => z.id === id)?.label || id,
            count,
            percentage: Math.round((count / totalCrises) * 100)
          }))
          .sort((a, b) => b.count - a.count);

        const medMap = {};
        logs.forEach((l) => {
          if (!l.medication || l.medication === 'Aucun') return;
          if (!medMap[l.medication]) medMap[l.medication] = { count: 0, totalRelief: 0 };
          medMap[l.medication].count += 1;
          medMap[l.medication].totalRelief += Number(l.reliefScore || 0);
        });
        const medicationStats = Object.entries(medMap)
          .map(([name, d]) => ({
            name,
            count: d.count,
            avgRelief: (d.totalRelief / d.count).toFixed(1),
            efficiencyPercent: Math.round(((d.totalRelief / d.count) / 5) * 100)
          }))
          .sort((a, b) => b.efficiencyPercent - a.efficiencyPercent);

        const sorted = [...logs].sort((a, b) => new Date(b.date) - new Date(a.date));
        const diffDays = Math.max(0, Math.floor((new Date('2026-10-15') - new Date(sorted[0].date)) / (1000 * 60 * 60 * 24)));

        return {
          totalCrises,
          avgIntensity: (sumIntensity / totalCrises).toFixed(1),
          avgDuration: (sumDuration / totalCrises).toFixed(1),

                  })}
                </div>
              </div>
            )}

            {/* TAB 6: NEUROLOGIST REPORT */}
            {activeTab === 'report' && (
              <div className="space-y-6">
                <div className={`p-6 rounded-2xl border ${darkMode ? 'bg-slate-900/90 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                  <div className="flex flex-wrap items-center justify-between gap-4 pb-5 border-b border-slate-800">
                    <div>
                      <h2 className="text-lg font-bold">🩺 Synthèse Clinique & Export pour le Neurologue</h2>
                      <p className="text-xs text-slate-400">Personnalisez et exportez votre bilan médical.</p>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <button onClick={handleCopyReport} className="px-3.5 py-2 rounded-xl border border-slate-700 bg-slate-800 text-xs font-semibold text-slate-200">
                        📋 Copier le texte
                      </button>
                      <button onClick={handleDownloadCSV} className="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-semibold">
                        📊 Exporter Excel (.CSV)
                      </button>
                      <button onClick={() => window.print()} className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold">
                        🖨️ Imprimer / PDF
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-5">
                    <input
                      type="text"
                      placeholder="Votre Nom & Prénom"
                      value={patientName}
                      onChange={(e) => setPatientName(e.target.value)}
                      className={`px-3 py-2 rounded-xl border text-xs sm:text-sm ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`}
                    />
                    <input
                      type="text"
                      placeholder="Médecin / Neurologue"
                      value={neurologistName}
                      onChange={(e) => setNeurologistName(e.target.value)}
                      className={`px-3 py-2 rounded-xl border text-xs sm:text-sm ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`}
                    />
                    <input
                      type="text"
                      placeholder="Traitement de fond"
                      value={preventiveTreatment}
                      onChange={(e) => setPreventiveTreatment(e.target.value)}
                      className={`px-3 py-2 rounded-xl border text-xs sm:text-sm ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-300'}`}
                    />
                  </div>
                </div>
              </div>
            )}

            {/* TAB 7: REAL SOLUTION TO UNLOCK THE "INSTALL" BUTTON */}
            {activeTab === 'cloud_mobile' && (
              <div className="space-y-6">
                {/* Direct Explanation of Why Downloads Inside Gemini Webview Are Blocked */}
                <div className={`p-6 rounded-2xl border-2 ${darkMode ? 'bg-slate-900/95 border-amber-500/50' : 'bg-white border-amber-300 shadow-sm'}`}>
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 text-xs font-bold mb-3">
                    💡 Pourquoi rien n'est allé dans votre dossier « Téléchargements » ?
                  </div>
                  <h2 className="text-base sm:text-lg font-bold text-white mb-2">
                    L'application Gemini bloque les téléchargements de fichiers depuis l'aperçu
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                    Pour des raisons de sécurité, l'aperçu interne de Gemini interdit aux boutons de télécharger un fichier `.html` directement dans votre téléphone. Mais <strong>vous n'avez même pas besoin de télécharger de fichier !</strong> Il est beaucoup plus simple de <strong>copier le code</strong> en 1 clic.
                  </p>
                </div>

                {/* The Copy-Paste No-File Method */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* Step by step with CodePen / EdgeOne / Export */}
                  <div className={`p-6 rounded-2xl border ${darkMode ? 'bg-slate-900/90 border-emerald-500/40' : 'bg-white border-emerald-200 shadow-sm'}`}>
                    <div className="inline-block px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold mb-3">
                      MÉTHODE SANS FICHIER : Juste un Copier / Coller
                    </div>
                    <h3 className="text-base font-bold mb-3">
                      Comment sortir l'application de Gemini en 30 secondes :
                    </h3>

                    <ol className="space-y-3.5 text-xs sm:text-sm text-slate-300 list-decimal list-inside leading-relaxed">
                      <li>
                        Regardez tout en haut à droite de votre écran Gemini : appuyez sur les <strong>3 petits points <code>•••</code></strong> (ceux de votre 1ère capture d'écran).
                      </li>
                      <li>
                        Appuyez sur la dernière ligne du menu : <strong>« Copy code »</strong> (Copier le code). Tout le code propre de votre application est maintenant copié !
                      </li>
                      <li>
                        Si vous voulez plutôt le vrai fichier dans votre téléphone, appuyez sur la 1ère ligne de ce même menu <code>•••</code> : <strong>« Export »</strong> (c'est le seul bouton autorisé par Google à enregistrer un fichier hors de Gemini).
                      </li>
                    </ol>
                  </div>

                  {/* Google Drive Backup & Restore */}
                  <div className={`p-6 rounded-2xl border flex flex-col justify-between ${darkMode ? 'bg-slate-900/90 border-indigo-500/40' : 'bg-white border-indigo-200 shadow-sm'}`}>
                    <div>
                      <div className="inline-block px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-300 text-xs font-bold mb-3">
                        ☁️ VOS DONNÉES & GOOGLE DRIVE
                      </div>
                      <h3 className="text-base font-bold mb-2">
                        Sauvegarder ou restaurer votre journal de crises
                      </h3>
                      <p className="text-xs sm:text-sm text-slate-300 leading-relaxed mb-4">
                        Sur téléphone, le bouton ci-dessous ouvre directement le menu de partage natif d'Android/iOS pour envoyer votre sauvegarde vers l'application <strong>Google Drive</strong> de votre téléphone (sans passer par le dossier Téléchargements).
                      </p>
                    </div>

                    <div className="grid grid-cols-1 gap-3 pt-2">
                      <button
                        type="button"
                        onClick={handleExportJSONToDrive}
                        className="p-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-2 shadow-lg"
                      >
                        <span>☁️</span> Partager ma sauvegarde vers Google Drive
                      </button>
                      <label className="p-3.5 rounded-xl border border-emerald-500/40 bg-emerald-500/10 text-emerald-300 font-bold text-xs sm:text-sm flex items-center justify-center gap-2 cursor-pointer text-center">
                        <span>📂</span> Restaurer mes données depuis Google Drive
                        <input type="file" accept=".json,application/json" onChange={handleImportJSON} className="hidden" />
                      </label>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Modal for Crisis Details */}
          {selectedLogModal && (
            <div
              className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4"
              onClick={() => setSelectedLogModal(null)}
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className={`w-full max-w-2xl rounded-2xl border p-6 max-h-[90vh] overflow-y-auto ${darkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-slate-200 text-slate-800'}`}
              >
                <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                  <div>
                    <h3 className="text-lg font-bold">
                      Détail de la crise du {selectedLogModal.date} à {selectedLogModal.startTime}
                    </h3>
                    <p className="text-xs text-slate-400">
                      Durée : {selectedLogModal.durationHours}h • Intensité : {selectedLogModal.intensity}/10
                    </p>
                  </div>
                  <button onClick={() => setSelectedLogModal(null)} className="p-2 rounded-lg text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 py-5">
                  <div>
                    <h4 className="text-xs font-bold uppercase text-slate-400 mb-2 text-center">Cartographie de la douleur</h4>
                    <InteractiveHeadMap selectedZones={selectedLogModal.zones || []} readOnly={true} darkMode={darkMode} />
                  </div>
                  <div className="space-y-4 text-xs sm:text-sm">
                    <div>
                      <h4 className="text-xs font-bold uppercase text-amber-400 mb-1.5">Déclencheurs identifiés</h4>
                      <div className="flex flex-wrap gap-1.5">
                        {(selectedLogModal.triggers || []).map((tId) => {
                          const t = TRIGGERS_CATALOG.find((item) => item.id === tId);
                          return (
                            <span key={tId} className="px-2.5 py-1 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs">
                              {t ? `${t.icon} ${t.label}` : tId}
                            </span>
                          );
                        })}
                      </div>
                    </div>
                    <div>
                      <h4 className="text-xs font-bold uppercase text-emerald-400 mb-1">Traitement & Efficacité</h4>
                      <p className="font-medium">{selectedLogModal.medication}</p>
                      <p className="text-xs text-emerald-400">
                        Soulagement : {'★'.repeat(selectedLogModal.reliefScore || 3)} ({selectedLogModal.reliefScore || 3}/5)
                      </p>
                    </div>
                    {selectedLogModal.notes && (
                      <div>
                        <h4 className="text-xs font-bold uppercase text-slate-400 mb-1">Notes</h4>
                        <p className="p-3 rounded-xl border border-slate-700 bg-slate-800/60 text-xs">{selectedLogModal.notes}</p>
                      </div>
                    )}
                  </div>
                </div>

                <div className="flex justify-end gap-3 pt-4 border-t border-slate-800">
                  <button onClick={() => handleEditLog(selectedLogModal)} className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold">
                    ✏️ Modifier cette entrée
                  </button>
                  <button onClick={() => setSelectedLogModal(null)} className="px-4 py-2 rounded-xl border border-slate-700 text-xs font-semibold">
                    Fermer
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NeuroTrackApp />);
  </script>
</body>
</html>
